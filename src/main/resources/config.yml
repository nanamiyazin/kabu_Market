# ===== KabuMarket 設定 =====

# 時間の進み方
#   REAL : 現実の曜日・時刻で進む（あつ森と同じ。日曜午前に買い、月〜土に売る）
#   GAME : マイクラ内の日数で進む（ゲーム内7日 = 1週間）
time-mode: REAL

# REAL モード用
timezone: Asia/Tokyo
# この時刻(時)以降を「午後」とする
real-pm-hour: 12

# GAME モード用
# 日数を数えるワールド名
game-world: world
# 1日(24000tick)のうち、この tick 以降を「午後」とする（6000 = 正午）
game-pm-tick: 6000

# お金は Vault 経由で経済プラグイン（EssentialsX など）のものを使う
# カブ価（90〜660くらいの数値）にこの倍率を掛けた金額で売買する
#   1.0 → カブ1個 = 約100（あつ森のベルと同じ感覚）
#   0.1 → カブ1個 = 約10（お金の価値が高いサーバー向け）
price-multiplier: 1.0

# カブは何個単位で買うか（あつ森は10個単位）
bundle-size: 10

# 価格が更新されたとき全員にお知らせする
announce-price-change: true
